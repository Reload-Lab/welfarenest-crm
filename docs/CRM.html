  <!-- Inizio Codice React -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const UserCircle = Icon('ph-user-circle');
    const Target = Icon('ph-target');

    const Plus = Icon('ph-plus');
    const Edit = Icon('ph-pencil-simple');
    const Trash2 = Icon('ph-trash');
    const X = Icon('ph-x');
    const Check = Icon('ph-check');
    const Search = Icon('ph-magnifying-glass');
    const Save = Icon('ph-floppy-disk');
    const ShieldCheck = Icon('ph-shield-check');
    const Send = Icon('ph-paper-plane-right');
    const FileText = Icon('ph-file-text');
    const AlertCircle = Icon('ph-warning-circle');
    const ChevronDown = Icon('ph-caret-down');
    const ChevronUp = Icon('ph-caret-up');
    const ExternalLink = Icon('ph-arrow-square-out');
    const BarChart2 = Icon('ph-chart-bar');
    const Download = Icon('ph-download-simple');
    const Settings = Icon('ph-gear');
    const Filter = Icon('ph-funnel');
    const Sliders = Icon('ph-sliders-horizontal');

    const UserPlus = Icon('ph-user-plus');
    const HeartHandshake = Icon('ph-handshake');
    const RefreshCw = Icon('ph-arrows-clockwise');

    // --- COSTANTI E OPZIONI ---
    const ORG_TYPES = [
      'Fondo sanitario', 'Ente bilaterale', 'Cassa di previdenza', 'SMS', 
      'Compagnia di assicurazione', 'Banca', 'SGR', 'ETS', 'Fondo pensione', 
      'Big pharma', 'Erogatore sanitario', 'TPA', 'Istituzioni', 
      'Università/Centro di ricerca', 'Società di consulenza', 'Società di consulenza comunicazione', 
      'Società di consulenza IT', 'Studio attuariale', 'Studio legale', 
      'Studio commercialista', 'Studio consulenza del lavoro', 'Studi professionali', 
      'Broker', 'Utility', 'Altre aziende'
    ];

    const DIMENSIONI_AZIENDALI = ['0-10', '10-50', '50-100', '100-500', '500-2000', '>2000'];
    const NUMERO_ISCRITTI = ['0-5000', '5000-10000', '10000-20000', '20000-50000', '50000-100000', '100000-150000', '150000-300000', '300000-500000', '>500000'];

    const SERVIZI_CLIENTE = ['WN+', 'NESTA', 'Consulenza strategica', 'Consulenza comunicazione', 'Assistenza legale', 'Consulenza IT', 'Segnalazione'];
    const STATUS_CLIENTE = ['Cliente attivo', 'Prospect', 'Fuori target'];

    const TAG1_OPTIONS = ['Presidente', 'Direttore', 'Responsabile Ufficio/Area', 'Consulente', 'Organi sociali', 'Consulente medico-sanitario', 'Consulente attuariale', 'Consulente comunicazione', 'Consulente legale', 'Consulente IT', 'Consulente del lavoro', 'Docente'];
    const TAG2_OPTIONS = ['Presidenza', 'Direzione', 'Area operativa', 'Area commerciale', 'Area comunicazione', 'Area formazione', 'Area liquidazioni'];

    const LEAD_STATUS = ['Da contattare', 'In lavorazione', 'Convertito', 'Perso'];

    // --- COMPONENTI UI GENERICI E STILI COMUNI ---
    const inputStyle = "w-full p-3 border border-slate-200 rounded-xl bg-slate-50 focus:bg-white focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition-all text-sm shadow-sm outline-none";
    const primaryBtnStyle = "bg-teal-600 hover:bg-teal-700 text-white px-6 py-2.5 rounded-xl flex items-center gap-2 font-semibold shadow-md hover:shadow-lg transition-all active:scale-95";
    const secondaryBtnStyle = "bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 hover:text-teal-700 px-5 py-2.5 rounded-xl font-medium transition-all shadow-sm";

    // HOOK PER ORDINAMENTO TABELLE
    const useSortableData = (items, config = null) => {
      const [sortConfig, setSortConfig] = useState(config);

      const sortedItems = useMemo(() => {
        let sortableItems = [...items];
        if (sortConfig !== null) {
          sortableItems.sort((a, b) => {
            let aVal = a[sortConfig.key];
            let bVal = b[sortConfig.key];
            
            // Logica personalizzata per chiavi complesse
            if (sortConfig.key === 'nominativo') {
              aVal = `${a.cognome} ${a.nome}`;
              bVal = `${b.cognome} ${b.nome}`;
            }
            if (sortConfig.key === 'nominativoLead') {
              aVal = `${a.cognome} ${a.nome}`;
              bVal = `${b.cognome} ${b.nome}`;
            }
            if (sortConfig.key === 'ruoloOrg') {
              aVal = a.isClient ? 'A' : a.isSupplier ? 'B' : 'C';
              bVal = b.isClient ? 'A' : b.isSupplier ? 'B' : 'C';
            }
            if (sortConfig.key === 'ruoloWN') {
              aVal = a.isStaffWN ? '1' : a.isCollaboratoreWN ? '2' : '3';
              bVal = b.isStaffWN ? '1' : b.isCollaboratoreWN ? '2' : '3';
            }
            if (sortConfig.key === 'orgsList') {
              aVal = (a.orgs || []).join(', ');
              bVal = (b.orgs || []).join(', ');
            }

            if (aVal === undefined || aVal === null) aVal = '';
            if (bVal === undefined || bVal === null) bVal = '';
            
            if (typeof aVal === 'string') aVal = aVal.toLowerCase();
            if (typeof bVal === 'string') bVal = bVal.toLowerCase();

            if (aVal < bVal) return sortConfig.direction === 'ascending' ? -1 : 1;
            if (aVal > bVal) return sortConfig.direction === 'ascending' ? 1 : -1;
            return 0;
          });
        }
        return sortableItems;
      }, [items, sortConfig]);

      const requestSort = (key) => {
        let direction = 'ascending';
        if (sortConfig && sortConfig.key === key && sortConfig.direction === 'ascending') {
          direction = 'descending';
        }
        setSortConfig({ key, direction });
      };

      return { items: sortedItems, requestSort, sortConfig };
    };

    const SortableHeader = ({ label, sortKey, sortConfig, requestSort, align = "left" }) => {
      const isActive = sortConfig?.key === sortKey;
      return (
        <th 
          className={`p-5 text-xs font-bold uppercase tracking-widest text-slate-400 border-b border-slate-100 cursor-pointer hover:bg-slate-50 transition-colors group select-none ${align === 'center' ? 'text-center' : align === 'right' ? 'text-right' : 'text-left'}`} 
          onClick={() => requestSort(sortKey)}
        >
          <div className={`flex items-center gap-1.5 ${align === 'center' ? 'justify-center' : align === 'right' ? 'justify-end' : 'justify-start'}`}>
            {label}
            <span className={`text-slate-400 flex flex-col ${isActive ? 'opacity-100' : 'opacity-0 group-hover:opacity-40 transition-opacity'}`}>
              {isActive && sortConfig.direction === 'descending' ? <ChevronDown size={14} strokeWidth={3}/> : <ChevronUp size={14} strokeWidth={3}/>}
            </span>
          </div>
        </th>
      );
    };

    const TableHeader = ({ children }) => <th className="p-5 text-xs font-bold uppercase tracking-widest text-slate-400 border-b border-slate-100">{children}</th>;
    const TableCell = ({ children, className="" }) => <td className={`p-5 text-sm text-slate-700 border-b border-slate-50 ${className}`}>{children}</td>;

    // --- COMPONENTE PER I BADGE DEI CONSENSI ---
    const ConsentBadge = ({ label, hasConsent }) => (
      <div 
        className={`flex items-center gap-1.5 px-2 py-0.5 rounded-md text-[10px] font-bold uppercase tracking-wider border transition-colors cursor-help ${
          hasConsent 
            ? 'bg-emerald-50 text-emerald-700 border-emerald-200' 
            : 'bg-slate-50 text-slate-400 border-slate-200'
        }`} 
        title={`${label}: ${hasConsent ? 'Consenso acquisito' : 'Consenso mancante'}`}
      >
        <div className={`w-1.5 h-1.5 rounded-full ${hasConsent ? 'bg-emerald-500 shadow-[0_0_5px_rgba(16,185,129,0.5)]' : 'bg-slate-300'}`}></div>
        {label}
      </div>
    );

    const Modal = ({ isOpen, onClose, title, children }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center overflow-y-auto overflow-x-hidden bg-slate-900/40 backdrop-blur-sm p-4 transition-all">
          <div className="relative w-full max-w-4xl max-h-[90vh] flex flex-col rounded-2xl bg-white shadow-2xl border border-slate-100 transform transition-all scale-100 opacity-100">
            <div className="flex items-center justify-between border-b border-slate-100 p-5 px-6">
              <h3 className="text-xl font-bold text-slate-800">{title}</h3>
              <button type="button" onClick={onClose} className="rounded-full p-2 bg-slate-50 hover:bg-slate-100 text-slate-500 hover:text-slate-800 transition-colors">
                <X size={20} />
              </button>
            </div>
            <div className="p-6 md:p-8 overflow-y-auto flex-1 custom-scrollbar bg-slate-50/30">
              {children}
            </div>
          </div>
        </div>
      );
    };

    const Toast = ({ message, type = 'success', onClose }) => {
      useEffect(() => {
        const timer = setTimeout(onClose, 3000);
        return () => clearTimeout(timer);
      }, [onClose]);

      return (
        <div className={`fixed bottom-6 right-6 z-[60] flex items-center gap-3 rounded-2xl px-5 py-4 shadow-xl text-white transform transition-all translate-y-0 opacity-100 ${type === 'success' ? 'bg-teal-600' : type === 'error' ? 'bg-rose-500' : 'bg-slate-800'}`}>
          <div className={`p-1 rounded-full bg-white/20`}>
            {type === 'success' ? <Check size={18} /> : <AlertCircle size={18} />}
          </div>
          <span className="font-semibold tracking-wide text-sm">{message}</span>
        </div>
      );
    };

    // --- APP PRINCIPALE ---
    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [toast, setToast] = useState(null);

      const [orgModal, setOrgModal] = useState({ isOpen: false, data: null });
      const [contactModal, setContactModal] = useState({ isOpen: false, data: null, convertingLeadId: null });
      const [leadModal, setLeadModal] = useState({ isOpen: false, data: null });

      const [organizations, setOrganizations] = useState([
        { id: 0, isClient: false, isSupplier: false, ragioneSociale: 'Welfare Nest', partitaIva: '11223344556', codiceFiscale: '11223344556', tipo: 'Società di consulenza comunicazione', sedeLegale: { indirizzo: 'Viale Innovazione 1', citta: 'Milano', provincia: 'MI', cap: '20100', paese: 'Italia' }, dimensione: '10-50' },
        { id: 1, isClient: true, isSupplier: false, ragioneSociale: 'Fondo Sanitario Alpha', partitaIva: '12345678901', codiceFiscale: '12345678901', tipo: 'Fondo sanitario', sedeLegale: { indirizzo: 'Via Roma 1', citta: 'Milano', provincia: 'MI', cap: '20100', paese: 'Italia' }, email: 'info@fondoalpha.it', telefono: '02 123456', pec: 'fondoalpha@pec.it', sdi: 'USAL8WQ', splitPayment: true, dimensione: '50-100', iscritti: '10000-20000', serviziStatus: { 'WN+': 'Cliente attivo', 'Consulenza strategica': 'Prospect' } },
        { id: 2, isClient: false, isSupplier: true, ragioneSociale: 'Tech Solutions srl', partitaIva: '09876543210', tipo: 'Società di consulenza IT', sedeLegale: { indirizzo: 'Via Verdi 4', citta: 'Roma' }, dimensione: '10-50' }
      ]);
      
      const [contacts, setContacts] = useState([
        { id: 1, nome: 'Mario', cognome: 'Rossi', telefoni: ['3331234567'], origine: 'Fiera', isStaffWN: false, isCollaboratoreWN: false, ruoloWN: '', orgs: ['Fondo Sanitario Alpha'], aziendeDettagli: { 'Fondo Sanitario Alpha': { emails: ['mario.rossi@fondoalpha.it'], tag1: 'Direttore', tag2: 'Direzione', privacy: true, marketing: false, privacyLog: ['Consenso acquisito il 10/10/2023'], marketingLog: [], isReferenteWN: true, wnPlusUser: 'm.rossi', wnPlusPass: 'pass123' } } },
        { id: 2, nome: 'Giulia', cognome: 'Bianchi', telefoni: ['3389876543', '0289876543'], origine: 'Assunzione', isStaffWN: true, isCollaboratoreWN: false, ruoloWN: '', orgs: ['Welfare Nest', 'Fondo Sanitario Alpha'], aziendeDettagli: { 'Welfare Nest': { emails: ['g.bianchi@welfarenest.it'], tag1: 'Consulente', privacy: true, wnPlusUser: 'gbianchi_wn', wnPlusPass: 'secure!' }, 'Fondo Sanitario Alpha': { emails: ['giulia.consulenza@fondoalpha.it'], tag1: 'Consulente', tag2: 'Area operativa', privacy: true, marketing: true } } }
      ]);

      const [leads, setLeads] = useState([
        { id: 1, azienda: 'Beta SGR', nome: 'Luigi', cognome: 'Verdi', email: 'l.verdi@betasgr.it', telefono: '3339876543', status: 'Da contattare', origine: 'Sito Web', privacy: true, marketing: true, privacyLog: ['Consenso acquisito il 14/10/2023 (Form Web)'], marketingLog: ['Consenso acquisito il 14/10/2023 (Form Web)'] },
        { id: 2, azienda: 'Tech Solutions srl', nome: 'Anna', cognome: 'Neri', email: 'anna@techsolutions.it', telefono: '3451234567', status: 'In lavorazione', origine: 'Linkedin', privacy: false, marketing: false, privacyLog: [], marketingLog: [] }
      ]);

      const [campaigns, setCampaigns] = useState([
        { id: 1, subject: 'Novità WN+ Autunno', list: 'community_wn', date: '15/10/2023 10:30', sent: 240, opened: 156, bounced: 3, errors: 0 },
        { id: 2, subject: 'Invito Evento Esclusivo', list: 'Contatti Spot (2)', date: '02/11/2023 14:15', sent: 2, opened: 2, bounced: 0, errors: 0 }
      ]);

      const [crmSettings, setCrmSettings] = useState({

      });

      const [trash, setTrash] = useState([]);

      const showToast = (msg, type='success') => setToast({ msg, type });

      const openOrgModal = (orgName) => {
        const org = organizations.find(o => o.ragioneSociale === orgName);
        if (org) {
          setContactModal({ isOpen: false, data: null, convertingLeadId: null });
          setActiveTab('organizations');
          setOrgModal({ isOpen: true, data: org });
        } else {

      const openContactModal = (contactId) => {
        const contact = contacts.find(c => c.id === contactId);
        if (contact) {
          setOrgModal({ isOpen: false, data: null });
          setActiveTab('contacts');
          setContactModal({ isOpen: true, data: contact, convertingLeadId: null });
        }
      };

      const handleSaveOrg = (org) => {
        if (orgModal.data && orgModal.data.id) {
          setOrganizations(organizations.map(d => d.id === org.id ? org : d));
          showToast('Organizzazione aggiornata con successo');
        } else {
          setOrganizations([...organizations, { ...org, id: Date.now() }]);
          showToast('Organizzazione creata con successo');
        }
        setOrgModal({ isOpen: false, data: null });
      };

      const handleSaveContact = (contact) => {
        if (contactModal.data && contactModal.data.id && !contactModal.convertingLeadId) {
          setContacts(contacts.map(d => d.id === contact.id ? contact : d));
          showToast('Contatto aggiornato con successo');
        } else {
          setContacts([...contacts, { ...contact, id: Date.now() }]);
          showToast('Contatto creato con successo');
          
          if (contactModal.convertingLeadId) {
            setLeads(leads.filter(l => l.id !== contactModal.convertingLeadId));
            showToast('Lead convertito con successo e rimosso dalla pipeline.', 'success');
          }
        }
        setContactModal({ isOpen: false, data: null, convertingLeadId: null });
      };

      const handleSaveLead = (lead) => {
        if (leadModal.data && leadModal.data.id) {
          setLeads(leads.map(d => d.id === lead.id ? lead : d));
          showToast('Lead aggiornato con successo');
        } else {
          setLeads([...leads, { ...lead, id: Date.now() }]);
          showToast('Nuovo Lead inserito');
        }
        setLeadModal({ isOpen: false, data: null });
      };

      const handleConvertLead = (lead) => {
        let orgName = lead.azienda;
        let existingOrg = organizations.find(o => o.ragioneSociale.toLowerCase() === (orgName || '').toLowerCase());
        
        if (!existingOrg && orgName) {
          const newOrg = {
            id: Date.now(),
            ragioneSociale: orgName,
            tipo: 'Altre aziende',
            isClient: false,
            isSupplier: false,
            sedeLegale: { indirizzo: '', citta: '', provincia: '', cap: '', paese: 'Italia' },

            email: '', telefono: '', pec: '', sdi: '', splitPayment: false, sitoWeb: '', dimensione: '', iscritti: '', serviziStatus: {}
          };
          setOrganizations(prev => [...prev, newOrg]);
        }

        const prefilledContact = {
          nome: lead.nome || '',
          cognome: lead.cognome || '',
          telefoni: lead.telefono ? [lead.telefono] : [''],
          origine: lead.origine || 'Conversione da Lead',
          isStaffWN: false,
          isCollaboratoreWN: false,
          ruoloWN: '',
          orgs: orgName ? [orgName] : [],
          aziendeDettagli: {}
        };

        if (orgName) {
           prefilledContact.aziendeDettagli[orgName] = {
             emails: [lead.email || ''], 
             tag1: '', tag2: '', 
             privacy: lead.privacy || false, 
             marketing: lead.marketing || false, 
             privacyLog: lead.privacyLog ? [...lead.privacyLog] : [], 
             marketingLog: lead.marketingLog ? [...lead.marketingLog] : [], 
             isReferenteWN: false, wnPlusUser: '', wnPlusPass: ''
           };
        }

        setLeadModal({ isOpen: false, data: null });
        setContactModal({ isOpen: true, data: prefilledContact, convertingLeadId: lead.id });
      };

      const deleteOrg = (id) => { 
        const item = organizations.find(d => d.id === id);
        if (item) {
          setTrash(prev => [...prev, { trashId: Date.now(), originalId: item.id, type: 'Organizzazione', name: item.ragioneSociale, data: item, deletedAt: new Date().toLocaleString('it-IT') }]);
          setOrganizations(organizations.filter(d => d.id !== id)); 
          showToast('Organizzazione spostata nel cestino'); 
        }
      };
      
      const deleteContact = (id) => { 
        const item = contacts.find(d => d.id === id);
        if (item) {
          setTrash(prev => [...prev, { trashId: Date.now(), originalId: item.id, type: 'Contatto', name: `${item.nome} ${item.cognome}`.trim(), data: item, deletedAt: new Date().toLocaleString('it-IT') }]);
          setContacts(contacts.filter(d => d.id !== id)); 
          showToast('Contatto spostato nel cestino'); 
        }
      };
      
      const deleteLead = (id) => { 
        const item = leads.find(d => d.id === id);
        if (item) {
          const leadName = item.nome || item.cognome ? `${item.nome} ${item.cognome}`.trim() : item.referente;
          setTrash(prev => [...prev, { trashId: Date.now(), originalId: item.id, type: 'Lead', name: `${item.azienda}${leadName ? ` (${leadName})` : ''}`, data: item, deletedAt: new Date().toLocaleString('it-IT') }]);
          setLeads(leads.filter(d => d.id !== id)); 
          showToast('Lead spostato nel cestino'); 
        }
      };

      const SidebarItem = ({ id, icon: Icon, label }) => (
        <button
          onClick={() => setActiveTab(id)}
          className={`w-full flex items-center gap-3.5 px-4 py-3.5 rounded-xl text-left transition-all duration-200 group ${
            activeTab === id 
              ? 'bg-teal-50 text-teal-700 font-bold shadow-sm' 
              : 'text-slate-500 hover:bg-slate-50 hover:text-slate-800 font-medium'
          }`}
        >
          <Icon size={20} className={`${activeTab === id ? 'text-teal-600' : 'text-slate-400 group-hover:text-teal-500'} transition-colors`} />
          <span>{label}</span>
        </button>
      );

      return (
        <div className="flex h-screen w-full bg-slate-50/50 font-sans text-slate-800 selection:bg-teal-100 selection:text-teal-900">

              </div>
              <div>
                <h1 className="text-xl font-extrabold text-slate-800 tracking-tight leading-tight">{crmSettings.systemName}</h1>
                <p className="text-[10px] uppercase tracking-widest text-teal-600 font-bold mt-0.5">Management System</p>
              </div>
            </div>
            <nav className="flex-1 p-4 space-y-1 overflow-y-auto custom-scrollbar">
              <SidebarItem id="dashboard" icon={LayoutDashboard} label="Dashboard" />
              <div className="my-3 border-t border-slate-100"></div>
              <SidebarItem id="organizations" icon={Building2} label="Organizzazioni" />
              <SidebarItem id="contacts" icon={Users} label="Contatti" />
              <SidebarItem id="staff" icon={UserCircle} label="Team & Collaboratori" />
              <div className="my-3 border-t border-slate-100"></div>
              <SidebarItem id="leads" icon={Target} label="Lead" />
              <SidebarItem id="newsletter" icon={Mail} label="Invio Newsletter" />
              <div className="my-3 border-t border-slate-100"></div>
              <SidebarItem id="report" icon={Download} label="Esportazioni" />
              <SidebarItem id="settings" icon={Settings} label="Impostazioni" />
              <div className="my-3 border-t border-slate-100"></div>
              <SidebarItem id="trash" icon={Trash2} label="Cestino" />
            </nav>

    const OrgFormModal = ({ isOpen, onClose, onSave, initialData, contacts, openContactModal }) => {
      const [formData, setFormData] = useState({
        isClient: false, isSupplier: false, ragioneSociale: '', partitaIva: '', codiceFiscale: '', tipo: '',
        sedeLegale: { indirizzo: '', citta: '', provincia: '', cap: '', paese: 'Italia' },
        hasSedeOperativa: false, sedeOperativa: { indirizzo: '', citta: '', provincia: '', cap: '', paese: 'Italia' },
        email: '', telefono: '', pec: '', sdi: '', splitPayment: false, sitoWeb: '', dimensione: '',
        iscritti: '', serviziStatus: {}
      });

      useEffect(() => {
        const defaultState = {
          isClient: false, isSupplier: false, ragioneSociale: '', partitaIva: '', codiceFiscale: '', tipo: '',
          sedeLegale: { indirizzo: '', citta: '', provincia: '', cap: '', paese: 'Italia' },
          hasSedeOperativa: false, sedeOperativa: { indirizzo: '', citta: '', provincia: '', cap: '', paese: 'Italia' },
          email: '', telefono: '', pec: '', sdi: '', splitPayment: false, sitoWeb: '', dimensione: '',
          iscritti: '', serviziStatus: {}
        };
        if (initialData) {
          setFormData({
            ...defaultState,
            ...initialData,
            sedeLegale: { ...defaultState.sedeLegale, ...(initialData.sedeLegale || {}) },
            sedeOperativa: { ...defaultState.sedeOperativa, ...(initialData.sedeOperativa || {}) },
            serviziStatus: initialData.serviziStatus || {}
          });
        } else {
          setFormData(defaultState);
        }
      }, [initialData, isOpen]);

        const { name, value, type, checked } = e.target;
        const val = type === 'checkbox' ? checked : value;
        
        if (section) {
          setFormData(prev => ({ ...prev, [section]: { ...prev[section], [field || name]: val } }));
        } else {
          setFormData(prev => ({ ...prev, [name]: val }));
        }
      };

      const handleServiceStatusChange = (service, status) => {
        setFormData(prev => {
          const newStatus = { ...prev.serviziStatus };
          if (status) {
            newStatus[service] = status;
          } else {
            delete newStatus[service];
          }
          return { ...prev, serviziStatus: newStatus };
        });
      };

                  <input type="email" name="pec" value={formData.pec || ''} onChange={handleChange} className={inputStyle} />

                      <input type="text" value={formData.sedeLegale?.cap || ''} onChange={(e) => handleChange(e, 'sedeLegale', 'cap')} className={inputStyle} />

                      <div className="text-xs text-slate-500 font-medium mt-2 flex flex-col gap-1.5">

                        {contact.isCollaboratoreWN && contact.ruoloWN && <div className="text-xs font-semibold text-slate-600">{contact.ruoloWN}</div>}
                        {(!contact.isStaffWN && !contact.isCollaboratoreWN) && <span className="text-xs font-medium text-slate-400 italic">Nessuno</span>}
                      </div>

                    <TableCell className="align-top">
                      <div className="space-y-3">
                        {contact.orgs?.map(orgName => {

                              <div className="flex items-center justify-between mb-2">
                                <span className="font-bold text-slate-700 cursor-pointer hover:text-teal-600 transition-colors flex items-center gap-1.5" onClick={() => openOrgModal(orgName)}>
                                  <Building2 size={14} className="text-slate-400"/> {orgName}

                                   <ConsentBadge label="GDPR" hasConsent={dett?.privacy} />
                                   <ConsentBadge label="Mktg" hasConsent={dett?.marketing} />

                        })}
                        {(!contact.orgs || contact.orgs.length === 0) && <span className="text-xs font-medium text-slate-400 italic bg-slate-50 px-3 py-2 rounded-lg block w-max">Nessuna azienda associata</span>}
                      </div>

                    <TableCell className="align-top">

    const ContactFormModal = ({ isOpen, onClose, onSave, initialData, organizations }) => {
      const [formData, setFormData] = useState({
        nome: '', cognome: '', telefoni: [''], origine: '', 
        isStaffWN: false, isCollaboratoreWN: false, ruoloWN: '',
        orgs: [], aziendeDettagli: {}
      });

      const [expandedOrg, setExpandedOrg] = useState(null);
      const [orgSearchTerm, setOrgSearchTerm] = useState('');
      const [showOrgSuggestions, setShowOrgSuggestions] = useState(false);

      useEffect(() => {
        const defaultState = {
          nome: '', cognome: '', telefoni: [''], origine: '', 
          isStaffWN: false, isCollaboratoreWN: false, ruoloWN: '',
          orgs: [], aziendeDettagli: {}
        };
        if (initialData) {
          setFormData({ 
            ...defaultState, 
            ...initialData,
            telefoni: initialData.telefoni?.length ? initialData.telefoni : ['']
          });
          if (initialData.orgs?.length > 0) setExpandedOrg(initialData.orgs[0]);
        } else {
          setFormData(defaultState);
          setExpandedOrg(null);
        }
        setOrgSearchTerm('');
        setShowOrgSuggestions(false);
      }, [initialData, isOpen]);

      const handleChange = (e) => {
        const { name, value, type, checked } = e.target;
        setFormData(prev => ({ ...prev, [name]: type === 'checkbox' ? checked : value }));
      };

      const handleTeamRoleChange = (role, checked) => {
        setFormData(prev => {
          const newData = { ...prev, [role]: checked };
          if (role === 'isStaffWN' && checked) {
            newData.isCollaboratoreWN = false;
            newData.ruoloWN = ''; 
          }
          if (role === 'isCollaboratoreWN' && checked) {
            newData.isStaffWN = false;
          }
          return newData;
        });
      };

      const handlePhoneChange = (index, value) => {
        setFormData(prev => {
          const telefoni = [...(prev.telefoni || [''])];
          telefoni[index] = value;
          return { ...prev, telefoni };
        });
      };
      const addPhone = () => setFormData(prev => ({ ...prev, telefoni: [...(prev.telefoni || []), ''] }));
      const removePhone = (idx) => setFormData(prev => ({ ...prev, telefoni: prev.telefoni.filter((_, i) => i !== idx) }));

      const handleOrgToggle = (orgName) => {
        setFormData(prev => {
          const currentOrgs = prev.orgs || [];
          const isAlreadyIncluded = currentOrgs.includes(orgName);
          const newOrgs = isAlreadyIncluded 
            ? currentOrgs.filter(o => o !== orgName) 
            : [...currentOrgs, orgName];
          
          const newDettagli = { ...prev.aziendeDettagli };
          
          if (!isAlreadyIncluded) {
            if (!newDettagli[orgName]) {
              newDettagli[orgName] = { 
                emails: [''], tag1: '', tag2: '', 
                privacy: false, marketing: false, privacyLog: [], marketingLog: [],
                isReferenteWN: false, wnPlusUser: '', wnPlusPass: ''
              };
            }
            setExpandedOrg(orgName);
          } else {
            if (expandedOrg === orgName) setExpandedOrg(null);
          }

          return { ...prev, orgs: newOrgs, aziendeDettagli: newDettagli };
        });
      };

      const handleOrgDettagliChange = (orgName, field, value) => {
        setFormData(prev => ({
          ...prev,
          aziendeDettagli: {
            ...prev.aziendeDettagli,
            [orgName]: {
              ...prev.aziendeDettagli[orgName],
              [field]: value
            }
          }
        }));
      };

      const handleOrgEmailChange = (orgName, index, value) => {
        setFormData(prev => {
          const emails = [...(prev.aziendeDettagli[orgName]?.emails || [''])];
          emails[index] = value;
          return {
            ...prev,
            aziendeDettagli: {
              ...prev.aziendeDettagli,
              [orgName]: { ...prev.aziendeDettagli[orgName], emails }
            }
          }
        });
      };

      const handleCheckboxDettaglio = (orgName, field, checked) => {
        const now = new Date().toLocaleString('it-IT');
        setFormData(prev => {
          const dett = prev.aziendeDettagli[orgName];
          let newLog = [];
          if (field === 'privacy') {
            newLog = [...(dett.privacyLog || []), `Consenso ${checked ? 'acquisito' : 'revocato'} il ${now}`];
            return { ...prev, aziendeDettagli: { ...prev.aziendeDettagli, [orgName]: { ...dett, privacy: checked, privacyLog: newLog } } };
          }
          if (field === 'marketing') {
            newLog = [...(dett.marketingLog || []), `Consenso ${checked ? 'acquisito' : 'revocato'} il ${now}`];
            return { ...prev, aziendeDettagli: { ...prev.aziendeDettagli, [orgName]: { ...dett, marketing: checked, marketingLog: newLog } } };
          }
          return { ...prev, aziendeDettagli: { ...prev.aziendeDettagli, [orgName]: { ...dett, [field]: checked } } };
        });
      };

      const isLinkedToWN = formData.orgs?.some(org => org.toLowerCase() === 'welfare nest');

      const filteredOrgs = organizations.filter(org => 
        org.ragioneSociale.toLowerCase().includes(orgSearchTerm.toLowerCase()) &&
        !(formData.orgs || []).includes(org.ragioneSociale)
      );

      return (
        <Modal isOpen={isOpen} onClose={onClose} title={initialData && initialData.nome ? `Profilo: ${initialData.nome} ${initialData.cognome}` : "Nuovo Contatto"}>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                  <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Nome *</label>
                  <input required type="text" name="nome" value={formData.nome || ''} onChange={handleChange} className={inputStyle} />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Cognome *</label>
                  <input type="text" name="cognome" value={formData.cognome || ''} onChange={handleChange} className={inputStyle} />
                </div>
                <div className="md:col-span-2">
                  <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Numeri di Telefono</label>
                  {(formData.telefoni || ['']).map((tel, idx) => (
                    <div key={idx} className="flex gap-3 mb-3">
                      <input type="tel" value={tel || ''} onChange={(e) => handlePhoneChange(idx, e.target.value)} className={inputStyle} placeholder="Inserisci recapito..." />
                      {idx > 0 && <button type="button" onClick={() => removePhone(idx)} className="p-3 text-rose-500 hover:bg-rose-50 rounded-xl border border-rose-100 transition-colors"><X size={18}/></button>}
                      {idx === (formData.telefoni || ['']).length - 1 && <button type="button" onClick={addPhone} className="p-3 text-teal-600 hover:bg-teal-50 rounded-xl border border-teal-100 transition-colors"><Plus size={18}/></button>}
                    </div>
                  ))}
                </div>
                <div className="md:col-span-2">
                   <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Origine Contatto</label>
                   <input type="text" name="origine" value={formData.origine || ''} onChange={handleChange} placeholder="Es: Fiera, LinkedIn, Form web..." className={inputStyle} />
                </div>
              </div>
            </div>

            <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm relative">
              <h4 className="font-bold mb-2 text-slate-800">Organizzazioni & Enti</h4>
              <p className="text-sm text-slate-500 mb-5 font-medium">Cerca e seleziona a quali aziende appartiene il contatto.</p>
              
              <div className="relative mb-5">
                <Search className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" size={18} />
                <input 
                  type="text"
                  value={orgSearchTerm}
                  onChange={(e) => {
                    setOrgSearchTerm(e.target.value);
                    setShowOrgSuggestions(true);
                  }}
                  onFocus={() => setShowOrgSuggestions(true)}
                  onBlur={() => setTimeout(() => setShowOrgSuggestions(false), 200)}
                  placeholder="Digita per cercare un'azienda..."
                  className="w-full pl-11 pr-4 py-3 border border-slate-200 rounded-xl bg-slate-50 focus:bg-white focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition-all text-sm outline-none"
                />
                {showOrgSuggestions && orgSearchTerm && filteredOrgs.length > 0 && (
                  <div className="absolute z-20 w-full mt-2 bg-white border border-slate-100 rounded-xl shadow-xl max-h-60 overflow-y-auto">
                    {filteredOrgs.map(org => (
                      <div 
                        key={org.id}
                        className="p-3.5 border-b border-slate-50 hover:bg-teal-50 cursor-pointer transition-colors"
                        onClick={() => {
                          handleOrgToggle(org.ragioneSociale);
                          setOrgSearchTerm('');
                          setShowOrgSuggestions(false);
                        }}
                      >
                        <div className="font-bold text-slate-800">{org.ragioneSociale}</div>
                        <div className="text-[10px] uppercase tracking-wider text-slate-500 font-bold mt-0.5">{org.tipo}</div>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              {formData.orgs?.length > 0 && (
                <div className="flex flex-wrap gap-2">
                  {formData.orgs.map(orgName => (
                    <span key={orgName} className="flex items-center gap-2 bg-teal-50 text-teal-800 border border-teal-200 px-3 py-1.5 rounded-lg text-sm font-bold shadow-sm transition-all hover:bg-teal-100">
                      <Building2 size={14} className="text-teal-600" />
                      {orgName}
                      <button type="button" onClick={() => handleOrgToggle(orgName)} className="ml-1 text-teal-600 hover:text-rose-600 transition-colors bg-white rounded-full p-0.5 shadow-sm">
                        <X size={14} strokeWidth={3} />
                      </button>
                    </span>
                  ))}
                </div>
              )}
            </div>

            {isLinkedToWN && (
              <div className="bg-slate-900 text-white p-6 rounded-2xl shadow-xl relative overflow-hidden">
                <div className="absolute top-0 right-0 opacity-10 pointer-events-none transform translate-x-1/4 -translate-y-1/4">
                  <ShieldCheck size={150} />
                </div>
                <h4 className="font-bold mb-5 flex items-center gap-2 text-teal-400"><ShieldCheck size={20}/> Rapporto interno con Welfare Nest</h4>
                <div className="flex flex-col md:flex-row gap-6 items-start md:items-center relative z-10">
                   <div className="flex flex-col sm:flex-row gap-4">
                      <label className={`flex items-center justify-center gap-3 cursor-pointer px-5 py-3 rounded-xl border-2 transition-all ${formData.isStaffWN ? 'bg-teal-600/20 border-teal-500 text-white' : 'bg-slate-800 border-slate-700 hover:border-slate-600 text-slate-300'}`}>
                        <input type="checkbox" checked={formData.isStaffWN || false} onChange={(e) => handleTeamRoleChange('isStaffWN', e.target.checked)} className="hidden" />
                        <span className="font-bold text-sm">Team Interno WN</span>
                      </label>

                <div className="bg-rose-500 text-white p-3 rounded-2xl shadow-md shadow-rose-500/20"><Trash2 size={26} strokeWidth={2}/></div>
                <div>
                  <h3 className="text-xl font-extrabold text-slate-800">Cestino di Sistema</h3>
                  <p className="text-sm font-medium text-slate-500 mt-0.5">Recupera o elimina in modo permanente gli elementi rimossi</p>
                </div>
              </div>
              <button 
                onClick={() => { setTrash([]); showToast('Cestino svuotato in modo permanente', 'error'); }} 
                disabled={trash.length === 0}
                className={`px-5 py-2.5 rounded-xl font-semibold transition-all shadow-sm flex items-center gap-2 ${trash.length === 0 ? 'bg-slate-50 text-slate-400 border border-slate-100 cursor-not-allowed' : 'bg-white border border-rose-200 text-rose-600 hover:bg-rose-50'}`}
              >
                <Trash2 size={18} /> Svuota Cestino
              </button>
            </div>
            <div className="overflow-x-auto">
              <table className="w-full text-left">
                <thead className="bg-slate-50/50">
                  <tr>
                    <SortableHeader label="Nome / Identificativo" sortKey="name" sortConfig={sortConfig} requestSort={requestSort} />
                    <SortableHeader label="Tipologia" sortKey="type" sortConfig={sortConfig} requestSort={requestSort} />
                    <SortableHeader label="Data Eliminazione" sortKey="deletedAt" sortConfig={sortConfig} requestSort={requestSort} />
                    <TableHeader><div className="text-right">Azioni</div></TableHeader>
                  </tr>
                </thead>
                <tbody>
                  {sortedTrash.map(item => (
                    <tr key={item.trashId} className="hover:bg-slate-50/80 transition-colors border-b border-slate-50 group">
                      <TableCell><span className="font-bold text-slate-800">{item.name}</span></TableCell>
                      <TableCell>
                        <span className={`px-3 py-1.5 rounded-lg text-[10px] uppercase tracking-wider font-bold ${item.type === 'Organizzazione' ? 'bg-blue-50 text-blue-700 border border-blue-100' : item.type === 'Contatto' ? 'bg-teal-50 text-teal-700 border border-teal-100' : 'bg-orange-50 text-orange-700 border border-orange-100'}`}>
                          {item.type}
                        </span>
                      </TableCell>
                      <TableCell><span className="text-xs font-semibold text-slate-500">{item.deletedAt}</span></TableCell>
                      <TableCell>
                        <div className="flex justify-end gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                          <button onClick={() => handleRestore(item)} className="px-3 py-2 text-teal-600 hover:text-white hover:bg-teal-500 rounded-xl transition-all border border-teal-100 flex items-center gap-1.5 shadow-sm" title="Ripristina">
                            <RefreshCw size={16} /> <span className="text-[10px] uppercase tracking-wider font-bold pr-1">Ripristina</span>
                          </button>
                          <button onClick={() => { setTrash(prev => prev.filter(t => t.trashId !== item.trashId)); showToast('Elemento eliminato', 'error'); }} className="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-xl transition-all shadow-sm">
                            <Trash2 size={18} />
                          </button>
                        </div>
                      </TableCell>
                    </tr>
                  ))}
                  {trash.length === 0 && (
                    <tr>
                      <td colSpan="4" className="p-16 text-center">
                        <div className="flex flex-col items-center justify-center text-slate-400">
                          <ShieldCheck size={48} className="mb-4 opacity-50" />
                          <p className="text-lg font-bold text-slate-600">Il cestino è vuoto</p>
                        </div>
                      </td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    };

    // Rendering dell'app
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
